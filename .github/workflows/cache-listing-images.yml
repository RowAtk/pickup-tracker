name: Cache listing photographs
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/lib/data/vehicles.ts'
      - 'scripts/import_jacars_images.py'
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and cache listing images
        run: python scripts/import_jacars_images.py
      - name: Commit cached photos and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/vehicles src/lib/data/vehicle-images.ts
          if ! git diff --cached --quiet; then
            git commit -m "Cache listing photographs"
            git push
          fi
