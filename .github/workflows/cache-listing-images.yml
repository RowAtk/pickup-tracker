name: Cache listing photographs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
  push:
    paths:
      - 'src/lib/data/vehicles.ts'
      - 'scripts/import_jacars_images.py'
      - 'scripts/report_vehicle_quality.py'
      - '.github/workflows/cache-listing-images.yml'
      - 'package-lock.json'
      - 'package.json'
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify runner can reach listing and image hosts
        run: |
          python - <<'PY'
          import socket, urllib.request
          hosts = ['www.jacars.net', 'www.google.com']
          for host in hosts:
              addresses = socket.getaddrinfo(host, 443)
              print(f'{host}: DNS OK ({len(addresses)} results)')
          url = 'https://www.jacars.net/adv/2523078_ford-ranger-3-2l-2019/'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; PickupTracker/1.0)'})
          with urllib.request.urlopen(req, timeout=30) as response:
              sample = response.read(200000)
              print(f'Listing HTTP {response.status}, bytes read {len(sample)}')
              if response.status != 200 or len(sample) < 1000:
                  raise RuntimeError('Listing source is not usable')
          PY
      - name: Retrieve and cache listing images
        run: python scripts/import_jacars_images.py
      - name: Audit data completeness
        if: always()
        run: python scripts/report_vehicle_quality.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickup-data-quality
          path: reports/vehicle-quality.json
          if-no-files-found: warn
      - name: Commit cached photos and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/vehicles src/lib/data/vehicle-images.ts package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Cache listing photographs and dependency lockfile"
            git pull --rebase origin main
            git push
          fi
